version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors (e.g. Next 16, TypeScript 7) get individual PRs for review.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
